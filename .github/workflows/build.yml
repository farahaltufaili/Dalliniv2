name: Build Dallini APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK (capture errors)
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon assembleDebug --console=plain 2>&1 | tee build-log.txt
      - name: Upload build log if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Dallini-v3-build-log
          path: build-log.txt
          if-no-files-found: ignore
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dallini-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
